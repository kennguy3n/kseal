<!doctype html>
<!-- Ships `dark` so the first paint matches the historical look with no flash;
     the theme module (src/lib/theme.ts) reconciles to the stored/system pref. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>kseal partner console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!--
      Runtime config injection (NoOps): a prebuilt image renders /env.js at
      container start from KSEAL_API_BASE_URL (see docker-entrypoint.sh). In
      local dev this file is absent and the app falls back to the Vite-inlined
      VITE_KSEAL_API_BASE_URL. Loaded before the bundle so window config exists.
    -->
    <script src="/env.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
