# Generates the Connect-Web TypeScript client into src/gen.
#
# Run via `npm run proto:gen`, which generates straight from the canonical proto
# module at ../../proto (see scripts/gen-proto.sh) — the same source of truth as
# the rest of the repo, including the read-side QueryService.
version: v2
clean: true
plugins:
  - local: ./node_modules/.bin/protoc-gen-es
    out: src/gen
    opt:
      - target=ts
      - import_extension=js
