# Generates the Connect-Web TypeScript client into src/gen.
#
# Run via `npm run proto:gen`, which vendors the canonical protos from
# ../../proto together with the console-local query_service.proto (see
# scripts/gen-proto.sh) so imports resolve in a single buf module.
version: v2
clean: true
plugins:
  - local: ./node_modules/.bin/protoc-gen-es
    out: src/gen
    opt:
      - target=ts
      - import_extension=js
