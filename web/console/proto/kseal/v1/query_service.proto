syntax = "proto3";

package kseal.v1;

import "kseal/v1/common.proto";

option go_package = "github.com/kennguy3n/kseal/server/gen/kseal/v1;ksealv1";

// QueryService is the dashboard's READ surface over derived data-plane state:
// stored risk events, tenant overview counters, and trust-session statistics.
//
// IMPORTANT — proposed addition, not yet in the canonical schema.
// The canonical protos under //proto only expose write/CRUD/attestation RPCs
// (RegistryService, ConfigService, TrustService, IngestService,
// WebhookService). The console owns `web/console/**` and must NOT modify
// `proto/**`, so this read API lives here and is generated alongside the
// canonical protos by `scripts/gen-proto.sh`. It MUST be promoted into the
// canonical `proto/kseal/v1/` and implemented by the data plane; until then
// the console calls these RPCs and degrades gracefully when the server
// returns Unimplemented. See web/console/README.md.
service QueryService {
  // ListEvents returns stored risk events for a tenant, filtered by app,
  // event type, fused risk level, and time range, with keyset pagination.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  // GetTenantOverview returns the dashboard summary counters for a tenant.
  rpc GetTenantOverview(GetTenantOverviewRequest) returns (GetTenantOverviewResponse);
  // GetTrustSessionStats returns trust-session outcome counts over a window.
  rpc GetTrustSessionStats(GetTrustSessionStatsRequest) returns (GetTrustSessionStatsResponse);
}

// EventRecord is a stored, queryable risk event: a server-enriched, persisted
// projection of a TelemetryEvent (plus the fused trust level and a stable id).
message EventRecord {
  string id = 1;
  string tenant_id = 2;
  string app_id = 3;
  EventType event_type = 4;
  // Fused trust classification for the originating instance at event time.
  TrustLevel risk_level = 5;
  uint64 risk_bits = 6;
  Confidence confidence = 7;
  string app_build_hash = 8;
  string policy_hash = 9;
  // Event time in unix milliseconds.
  int64 timestamp = 10;
  optional string country_or_region = 11;
}

message ListEventsRequest {
  string tenant_id = 1;
  // Optional app filter; empty means all apps in the tenant.
  string app_id = 2;
  // Optional event-type filter; empty means all types.
  repeated EventType event_types = 3;
  // Optional risk-level filter; empty means all levels.
  repeated TrustLevel risk_levels = 4;
  // Inclusive lower/upper time bounds in unix millis (0 means unbounded).
  int64 start_time = 5;
  int64 end_time = 6;
  int32 page_size = 7;
  string page_token = 8;
}
message ListEventsResponse {
  repeated EventRecord events = 1;
  string next_page_token = 2;
}

message GetTenantOverviewRequest { string tenant_id = 1; }
message GetTenantOverviewResponse {
  int32 app_count = 1;
  int32 build_count = 2;
  int32 active_policy_count = 3;
  int32 webhook_count = 4;
  int64 events_last_24h = 5;
  // A small slice of the most recent events for the overview panel.
  repeated EventRecord recent_events = 6;
}

message GetTrustSessionStatsRequest {
  string tenant_id = 1;
  // Window bounds in unix millis (0 means unbounded).
  int64 start_time = 2;
  int64 end_time = 3;
}
message GetTrustSessionStatsResponse {
  int64 total_sessions = 1;
  int64 tokens_issued = 2;
  int64 attestations_failed = 3;
  // Session counts bucketed by fused TrustLevel name (e.g. "TRUSTED" -> 1200).
  map<string, int64> sessions_by_trust_level = 4;
}
