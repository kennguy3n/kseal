<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>kseal console</title>
    <!--
      Runtime config injection (NoOps): a prebuilt image renders /env.js at
      container start from KSEAL_API_BASE_URL (see docker-entrypoint.sh). In
      local dev this file is absent and the app falls back to the Vite-inlined
      VITE_KSEAL_API_BASE_URL. Loaded before the bundle so window config exists.
    -->
    <script src="/env.js"></script>
    <!--
      Apply the persisted (or OS-preferred) color theme before first paint to
      avoid a light/dark flash. Mirrors resolveInitialTheme() in
      src/lib/theme.tsx: an explicit "light"/"dark" choice wins, any other
      value falls through to the OS preference.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("kseal.console.theme");
          var dark;
          if (stored === "light" || stored === "dark") {
            dark = stored === "dark";
          } else {
            dark =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches;
          }
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* localStorage may be unavailable; default to light. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
