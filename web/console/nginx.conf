server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed assets are immutable and safe to cache aggressively.
  location /assets/ {
    include /etc/nginx/snippets/kseal-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Runtime config must never be cached so a redeploy is picked up immediately.
  location = /env.js {
    include /etc/nginx/snippets/kseal-security-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  # SPA fallback: all other routes render index.html (client-side routing).
  location / {
    include /etc/nginx/snippets/kseal-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
