server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed assets are immutable and safe to cache aggressively.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Runtime config must never be cached so a redeploy is picked up immediately.
  location = /env.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # SPA fallback: all other routes render index.html (client-side routing).
  # Security headers are set here (the location that serves the HTML document).
  # connect-src is permissive because the kseal API origin is configured at
  # deploy time (env.js); script-src 'self' blocks inline/injected scripts.
  location / {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src *; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
