# Generates the Connect-Web TypeScript client for the CONSOLE-LOCAL proto module
# (proto-local/) into src/gen-local. Kept separate from buf.gen.yaml so
# regenerating the canonical client (src/gen, clean: true) never touches the
# console-local client and vice versa.
#
# Run via `npm run proto:gen:local` (scripts/gen-proto-local.sh).
version: v2
clean: true
plugins:
  - local: ./node_modules/.bin/protoc-gen-es
    out: src/gen-local
    opt:
      - target=ts
      - import_extension=js
