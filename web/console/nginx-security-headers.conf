# Shared security headers, included by every location so coverage is uniform
# (nginx does NOT inherit add_header into a location that sets its own headers,
# so each location must pull these in explicitly).
#
# connect-src defaults to '*' but docker-entrypoint.sh rewrites it at container
# start to "'self' <origin>" derived from KSEAL_API_BASE_URL (it stays '*' only
# when that is unset/non-derivable). script-src allows the inline theme
# initialization script in index.html; style-src and font-src allow Google Fonts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src *; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
