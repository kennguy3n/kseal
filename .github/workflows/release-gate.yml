name: release-gate

# Release gate for kseal. Every job must pass before a release is allowed to
# proceed. On pull requests and pushes to main it runs as standard CI; on a
# version tag (v*) it additionally guards the release. A failure in any job
# fails the `gate` job, which is the required status check for releasing.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.0"
  BUF_VERSION: "1.55.1"

jobs:
  # 1) Generated-binding drift: regenerating from the proto schemas must not
  #    change anything committed under server/gen.
  proto-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - name: Install proto toolchain
        run: make proto-tools
      - name: Regenerate bindings
        run: make proto
      - name: Fail on uncommitted drift
        run: |
          git diff --exit-code -- server/gen \
            || { echo "::error::server/gen is stale — run 'make proto' and commit"; exit 1; }

  # 2) Backwards-compatibility: proto changes must not break the schema on main.
  buf-breaking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ github.token }}
      - name: buf lint
        run: buf lint
        working-directory: proto
      - name: buf breaking (against main)
        run: |
          buf breaking \
            --against "https://github.com/${GITHUB_REPOSITORY}.git#branch=main,subdir=proto"
        working-directory: proto

  # 3) Build + unit tests (Go server + Rust trust core).
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk/rust-core
      - name: Install proto toolchain
        run: make proto-tools
      - name: Build (proto + server + rust)
        run: make build
      - name: Lint
        run: make lint
      - name: Unit tests (server + rust)
        run: make test

  # 4) End-to-end integration tests against real Postgres 16 + Redis 7.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kseal
          POSTGRES_PASSWORD: kseal
          POSTGRES_DB: kseal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kseal -d kseal"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The harness uses these endpoints instead of spinning up testcontainers.
      KSEAL_TEST_POSTGRES_DSN: "postgres://kseal:kseal@localhost:5432/kseal?sslmode=disable"
      KSEAL_TEST_REDIS_ADDR: "localhost:6379"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: tests/go.sum
      - name: Integration tests
        run: make test-integration

  # 5) Container build + vulnerability scan for both shipped images.
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            context: .
            dockerfile: server/Dockerfile
          - name: console
            context: web/console
            dockerfile: web/console/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (${{ matrix.name }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: kseal-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Scan image (${{ matrix.name }})
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: kseal-${{ matrix.name }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.name }}
          path: trivy-${{ matrix.name }}.sarif

  # 6) Deployment-artifact validation: chart, manifests, Terraform, workflows.
  deploy-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: helm lint + template + kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform
          helm lint deploy/helm/kseal
          for env in dev staging prod; do
            helm template kseal deploy/helm/kseal -f deploy/helm/kseal/values-$env.yaml \
              | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.29.0
          done
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: terraform fmt + validate
        run: |
          terraform -chdir=deploy/terraform fmt -check -recursive
          for dir in deploy/terraform/modules/* deploy/terraform/envs/*; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  # 7) The required check. Releasing is blocked unless every gate job passed.
  gate:
    needs: [proto-drift, buf-breaking, build-test, integration, images, deploy-validate]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Enforce all gates passed
        run: |
          results='${{ join(needs.*.result, ',') }}'
          echo "gate inputs: $results"
          if echo "$results" | tr ',' '\n' | grep -qvE '^success$'; then
            echo "::error::one or more release-gate jobs did not succeed"
            exit 1
          fi
          echo "all release-gate jobs passed"
