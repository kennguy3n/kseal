# kseal local stack: server + Postgres + Redis + dashboard.
#
# `make up` (or `docker compose up --build`) brings up a prod-mirroring system:
# health-gated startup ordering, resource limits, restart policies, hardened
# security options (no-new-privileges, dropped capabilities, read-only rootfs
# for the app containers), and a private bridge network. The server runs its
# embedded SQL migrations against Postgres on startup, so no init scripts are
# needed.
#
# Overridable via the environment (see .env): KSEAL_KEK, KSEAL_RATE_LIMIT_RPS,
# KSEAL_INGEST_QUOTA_PER_MIN, image tags, etc.

name: kseal

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kseal
      POSTGRES_PASSWORD: kseal
      POSTGRES_DB: kseal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [kseal]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kseal -d kseal"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Match prod eviction semantics: TTL'd nonces/rate-limit keys, no persistence.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
    ports:
      - "6379:6379"
    networks: [kseal]
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kseal-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      KSEAL_HTTP_ADDR: ":8080"
      KSEAL_POSTGRES_DSN: "postgres://kseal:kseal@postgres:5432/kseal?sslmode=disable"
      KSEAL_REDIS_ADDR: "redis:6379"
      KSEAL_LOG_LEVEL: "${KSEAL_LOG_LEVEL:-info}"
      KSEAL_ENV: "dev"
      # Stable local KEK so envelope-encrypted rows survive restarts. This is a
      # throwaway development key — NEVER use it outside local dev. Override with
      # `export KSEAL_KEK=$(head -c 32 /dev/urandom | base64)`.
      KSEAL_KEK: "${KSEAL_KEK:-ZGV2LW9ubHkta3NlYWwta2VrLTMyLWJ5dGVzLWFhYWE=}"
      KSEAL_CORS_ORIGINS: "${KSEAL_CORS_ORIGINS:-http://localhost:5173}"
      KSEAL_RATE_LIMIT_RPS: "${KSEAL_RATE_LIMIT_RPS:-200}"
      KSEAL_RATE_LIMIT_BURST: "${KSEAL_RATE_LIMIT_BURST:-400}"
      KSEAL_INGEST_QUOTA_PER_MIN: "${KSEAL_INGEST_QUOTA_PER_MIN:-6000}"
      # WS-F env-var contract (fail-safe, default-off). The local Redis above is
      # plaintext + no AUTH, so these stay disabled; override via .env to test
      # TLS/AUTH/OTLP/BYOK/retention against external services.
      KSEAL_REDIS_TLS: "${KSEAL_REDIS_TLS:-false}"
      KSEAL_REDIS_PASSWORD: "${KSEAL_REDIS_PASSWORD:-}"
      KSEAL_REDIS_CA_FILE: "${KSEAL_REDIS_CA_FILE:-}"
      KSEAL_OTLP_ENDPOINT: "${KSEAL_OTLP_ENDPOINT:-}"
      KSEAL_OTLP_SAMPLE_RATIO: "${KSEAL_OTLP_SAMPLE_RATIO:-0}"
      KSEAL_CMK_KMS_URI: "${KSEAL_CMK_KMS_URI:-}"
      KSEAL_RAW_RETENTION_DAYS: "${KSEAL_RAW_RETENTION_DAYS:-30}"
      # WS-Q production data-plane selection (fail-safe, default-off). Defaults
      # keep the in-memory broker + analytics store, so the stack is unchanged.
      # Flip KSEAL_BROKER=kafka / KSEAL_ANALYTICS=clickhouse (and run
      # `docker compose --profile dataplane up`) to route telemetry through the
      # Redpanda + ClickHouse services defined below. Connection defaults point
      # at those in-network services so no extra wiring is needed locally.
      KSEAL_BROKER: "${KSEAL_BROKER:-memory}"
      KSEAL_ANALYTICS: "${KSEAL_ANALYTICS:-memory}"
      KSEAL_KAFKA_BROKERS: "${KSEAL_KAFKA_BROKERS:-redpanda:9092}"
      KSEAL_KAFKA_TOPIC: "${KSEAL_KAFKA_TOPIC:-kseal.telemetry.events}"
      KSEAL_KAFKA_CONSUMER_GROUP: "${KSEAL_KAFKA_CONSUMER_GROUP:-kseal-analytics-writer}"
      KSEAL_CLICKHOUSE_ADDR: "${KSEAL_CLICKHOUSE_ADDR:-clickhouse:9000}"
      KSEAL_CLICKHOUSE_DATABASE: "${KSEAL_CLICKHOUSE_DATABASE:-kseal}"
      KSEAL_CLICKHOUSE_USERNAME: "${KSEAL_CLICKHOUSE_USERNAME:-kseal}"
      KSEAL_CLICKHOUSE_PASSWORD: "${KSEAL_CLICKHOUSE_PASSWORD:-kseal}"
    ports:
      - "8080:8080"
    networks: [kseal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Data-plane backends only exist under the `dataplane` profile.
      # `required: false` means the default `docker compose up` (no profile)
      # starts the server normally without these, but `--profile dataplane up`
      # gates startup on their health so the server doesn't crash-loop dialing
      # a not-yet-ready Redpanda/ClickHouse.
      redpanda:
        condition: service_healthy
        required: false
      clickhouse:
        condition: service_healthy
        required: false
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kseal-console:
    build:
      context: ./web/console
      dockerfile: Dockerfile
      args:
        # Vite inlines VITE_* vars at build time, so the API base URL is passed
        # as a build arg. The console Dockerfile additionally renders /env.js at
        # container start for deploy-time overrides.
        VITE_KSEAL_API_BASE_URL: "http://localhost:8080"
    restart: unless-stopped
    environment:
      # Runtime config injection (docker-entrypoint.sh renders /env.js).
      KSEAL_API_BASE_URL: "${KSEAL_API_BASE_URL:-http://localhost:8080}"
    ports:
      - "5173:80"
    networks: [kseal]
    depends_on:
      kseal-server:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Production data-plane backends (default-off) --------------------------
  # These run ONLY under the `dataplane` profile, so the standard `make up` /
  # `docker compose up` is unaffected:
  #
  #   KSEAL_BROKER=kafka KSEAL_ANALYTICS=clickhouse \
  #     docker compose --profile dataplane up --build
  #
  # The kseal-server above already defaults its connection envs to these
  # in-network services, so enabling the profile + flipping the two selectors is
  # all that's required locally.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    profiles: ["dataplane"]
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      # Auto-create the telemetry topic on first produce for local dev; in
      # production the topic is provisioned out-of-band (Terraform) with an
      # explicit partition count and retention.
      - --set
      - redpanda.auto_create_topics_enabled=true
    ports:
      - "9092:9092"
    networks: [kseal]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - redpandadata:/var/lib/redpanda/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1500m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    profiles: ["dataplane"]
    restart: unless-stopped
    environment:
      # Bootstrap the kseal database + user the analytics store expects. The
      # store creates the events table itself but not the database/user.
      CLICKHOUSE_DB: "${KSEAL_CLICKHOUSE_DATABASE:-kseal}"
      CLICKHOUSE_USER: "${KSEAL_CLICKHOUSE_USERNAME:-kseal}"
      CLICKHOUSE_PASSWORD: "${KSEAL_CLICKHOUSE_PASSWORD:-kseal}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    networks: [kseal]
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - chdata:/var/lib/clickhouse
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  kseal:
    driver: bridge

volumes:
  pgdata:
  redpandadata:
  chdata:
