# kseal local stack: server + Postgres + Redis + dashboard.
#
# `make up` (or `docker compose up --build`) brings up a prod-mirroring system:
# health-gated startup ordering, resource limits, restart policies, hardened
# security options (no-new-privileges, dropped capabilities, read-only rootfs
# for the app containers), and a private bridge network. The server runs its
# embedded SQL migrations against Postgres on startup, so no init scripts are
# needed.
#
# Overridable via the environment (see .env): KSEAL_KEK, KSEAL_RATE_LIMIT_RPS,
# KSEAL_INGEST_QUOTA_PER_MIN, image tags, etc.

name: kseal

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kseal
      POSTGRES_PASSWORD: kseal
      POSTGRES_DB: kseal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [kseal]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kseal -d kseal"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Match prod eviction semantics: TTL'd nonces/rate-limit keys, no persistence.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
    ports:
      - "6379:6379"
    networks: [kseal]
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kseal-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      KSEAL_HTTP_ADDR: ":8080"
      KSEAL_POSTGRES_DSN: "postgres://kseal:kseal@postgres:5432/kseal?sslmode=disable"
      KSEAL_REDIS_ADDR: "redis:6379"
      KSEAL_LOG_LEVEL: "${KSEAL_LOG_LEVEL:-info}"
      KSEAL_ENV: "dev"
      # Stable local KEK so envelope-encrypted rows survive restarts. This is a
      # throwaway development key — NEVER use it outside local dev. Override with
      # `export KSEAL_KEK=$(head -c 32 /dev/urandom | base64)`.
      KSEAL_KEK: "${KSEAL_KEK:-ZGV2LW9ubHkta3NlYWwta2VrLTMyLWJ5dGVzLWFhYWE=}"
      KSEAL_CORS_ORIGINS: "${KSEAL_CORS_ORIGINS:-http://localhost:5173}"
      KSEAL_RATE_LIMIT_RPS: "${KSEAL_RATE_LIMIT_RPS:-200}"
      KSEAL_RATE_LIMIT_BURST: "${KSEAL_RATE_LIMIT_BURST:-400}"
      KSEAL_INGEST_QUOTA_PER_MIN: "${KSEAL_INGEST_QUOTA_PER_MIN:-6000}"
    ports:
      - "8080:8080"
    networks: [kseal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kseal-console:
    build:
      context: ./web/console
      dockerfile: Dockerfile
      args:
        # Vite inlines VITE_* vars at build time, so the API base URL is passed
        # as a build arg. The console Dockerfile additionally renders /env.js at
        # container start for deploy-time overrides.
        VITE_KSEAL_API_BASE_URL: "http://localhost:8080"
    restart: unless-stopped
    environment:
      # Runtime config injection (docker-entrypoint.sh renders /env.js).
      KSEAL_API_BASE_URL: "${KSEAL_API_BASE_URL:-http://localhost:8080}"
    ports:
      - "5173:80"
    networks: [kseal]
    depends_on:
      kseal-server:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  kseal:
    driver: bridge

volumes:
  pgdata:
