# kseal local stack: server + Postgres + Redis + dashboard.
#
# `docker compose up --build` brings up a working system. The server runs its
# embedded SQL migrations against Postgres on startup, so no init scripts are
# needed here.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kseal
      POSTGRES_PASSWORD: kseal
      POSTGRES_DB: kseal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kseal -d kseal"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kseal-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      KSEAL_HTTP_ADDR: ":8080"
      KSEAL_POSTGRES_DSN: "postgres://kseal:kseal@postgres:5432/kseal?sslmode=disable"
      KSEAL_REDIS_ADDR: "redis:6379"
      KSEAL_LOG_LEVEL: "info"
      KSEAL_ENV: "dev"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  kseal-console:
    build:
      context: ./web/console
      dockerfile: Dockerfile
    environment:
      # Base URL the dashboard uses to reach the Connect API.
      VITE_KSEAL_API_BASE_URL: "http://localhost:8080"
    ports:
      - "5173:80"
    depends_on:
      - kseal-server

volumes:
  pgdata:
