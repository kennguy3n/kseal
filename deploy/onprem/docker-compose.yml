# kseal on-prem / air-gapped attestation verifier — self-contained stack.
#
# A customer-hosted deployment of the kseal verifier (server + Postgres + Redis
# + console) for the Regulated isolation tier. Designed to run with NO internet
# egress: all images come from the customer's internal registry (mirror them
# first with ./mirror-images.sh and the pinned refs in images.txt), and every
# external third-party attestation provider (Play Integrity, App Attest, cloud
# KMS, OTLP) is left unconfigured/off by default.
#
# Bring up:
#   cp .env.example .env       # set a real KSEAL_KEK + Postgres password
#   docker compose --env-file .env up -d --wait
#
# Override KSEAL_REGISTRY / KSEAL_VERSION to point at your mirrored images.

name: kseal-onprem

services:
  postgres:
    image: ${KSEAL_REGISTRY:-registry.internal.example.com}/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KSEAL_PG_USER:-kseal}
      POSTGRES_PASSWORD: ${KSEAL_PG_PASSWORD:?set KSEAL_PG_PASSWORD in .env}
      POSTGRES_DB: ${KSEAL_PG_DB:-kseal}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [kseal]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KSEAL_PG_USER:-kseal} -d ${KSEAL_PG_DB:-kseal}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: ${KSEAL_REGISTRY:-registry.internal.example.com}/redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-lru
    networks: [kseal]
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kseal-server:
    image: ${KSEAL_REGISTRY:-registry.internal.example.com}/kseal-server:${KSEAL_VERSION:-0.1.0}
    restart: unless-stopped
    environment:
      KSEAL_HTTP_ADDR: ":8080"
      # prod mode makes the KEK mandatory (fail-closed) — see server/shared/config.
      KSEAL_ENV: "prod"
      KSEAL_LOG_LEVEL: "${KSEAL_LOG_LEVEL:-info}"
      KSEAL_POSTGRES_DSN: "postgres://${KSEAL_PG_USER:-kseal}:${KSEAL_PG_PASSWORD:?set KSEAL_PG_PASSWORD in .env}@postgres:5432/${KSEAL_PG_DB:-kseal}?sslmode=disable"
      KSEAL_REDIS_ADDR: "redis:6379"
      # 32-byte base64 KEK. Generate offline: head -c 32 /dev/urandom | base64
      KSEAL_KEK: "${KSEAL_KEK:?set KSEAL_KEK in .env}"
      KSEAL_CORS_ORIGINS: "${KSEAL_CORS_ORIGINS:-http://localhost:5173}"
      KSEAL_RATE_LIMIT_RPS: "${KSEAL_RATE_LIMIT_RPS:-200}"
      KSEAL_RATE_LIMIT_BURST: "${KSEAL_RATE_LIMIT_BURST:-400}"
      KSEAL_INGEST_QUOTA_PER_MIN: "${KSEAL_INGEST_QUOTA_PER_MIN:-6000}"
      # WS-F contract — all off in air-gapped mode (no Redis TLS in-host, no
      # cloud KMS, no trace export). Raw retention defaults to 30 days on local
      # disk. Override only if your on-prem environment provides these.
      KSEAL_REDIS_TLS: "${KSEAL_REDIS_TLS:-false}"
      KSEAL_REDIS_PASSWORD: "${KSEAL_REDIS_PASSWORD:-}"
      KSEAL_REDIS_CA_FILE: "${KSEAL_REDIS_CA_FILE:-}"
      KSEAL_OTLP_ENDPOINT: "${KSEAL_OTLP_ENDPOINT:-}"
      KSEAL_OTLP_SAMPLE_RATIO: "${KSEAL_OTLP_SAMPLE_RATIO:-0}"
      KSEAL_CMK_KMS_URI: "${KSEAL_CMK_KMS_URI:-}"
      KSEAL_RAW_RETENTION_DAYS: "${KSEAL_RAW_RETENTION_DAYS:-30}"
    ports:
      - "${KSEAL_BIND_ADDR:-127.0.0.1}:8080:8080"
    networks: [kseal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  kseal-console:
    image: ${KSEAL_REGISTRY:-registry.internal.example.com}/kseal-console:${KSEAL_VERSION:-0.1.0}
    restart: unless-stopped
    environment:
      KSEAL_API_BASE_URL: "${KSEAL_API_BASE_URL:-http://localhost:8080}"
    ports:
      - "${KSEAL_BIND_ADDR:-127.0.0.1}:5173:80"
    networks: [kseal]
    depends_on:
      kseal-server:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  kseal:
    driver: bridge

volumes:
  pgdata:
