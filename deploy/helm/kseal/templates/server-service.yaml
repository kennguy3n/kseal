apiVersion: v1
kind: Service
metadata:
  name: {{ include "kseal.fullname" . }}-server
  labels:
    {{- include "kseal.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.server.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.server.service.type }}
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: h2c
  selector:
    {{- include "kseal.server.selectorLabels" . | nindent 4 }}
