apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kseal.fullname" . }}-server
  labels:
    {{- include "kseal.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
data:
  # Non-secret KSEAL_* tunables. Secrets (KEK/DSN/Redis) come from the Secret.
  KSEAL_HTTP_ADDR: ":{{ .Values.server.port }}"
  KSEAL_ENV: {{ .Values.env | quote }}
  KSEAL_LOG_LEVEL: {{ .Values.server.config.logLevel | quote }}
  KSEAL_REDIS_DB: {{ .Values.server.config.redisDB | quote }}
  KSEAL_NONCE_TTL: {{ .Values.server.config.nonceTTL | quote }}
  KSEAL_TRUST_TOKEN_TTL: {{ .Values.server.config.trustTokenTTL | quote }}
  KSEAL_CONFIG_TTL: {{ .Values.server.config.configTTL | quote }}
  KSEAL_RATE_LIMIT_RPS: {{ .Values.server.config.rateLimitRPS | quote }}
  KSEAL_RATE_LIMIT_BURST: {{ .Values.server.config.rateLimitBurst | quote }}
  KSEAL_INGEST_QUOTA_PER_MIN: {{ .Values.server.config.ingestQuotaPerMinute | quote }}
  KSEAL_CORS_ORIGINS: {{ join "," .Values.server.config.corsOrigins | quote }}
  {{- if .Values.server.config.featureFlags }}
  KSEAL_FEATURE_FLAGS: {{ .Values.server.config.featureFlags | quote }}
  {{- end }}
  # WS-F env-var contract (fail-safe, default-off). The Redis AUTH password is a
  # secret and is delivered via the Secret/ExternalSecret, never this ConfigMap.
  KSEAL_REDIS_TLS: {{ .Values.server.config.redisTls | quote }}
  {{- if .Values.server.config.redisCaSecret.name }}
  KSEAL_REDIS_CA_FILE: {{ printf "%s/%s" (trimSuffix "/" .Values.server.config.redisCaSecret.mountPath) .Values.server.config.redisCaSecret.key | quote }}
  {{- end }}
  KSEAL_OTLP_ENDPOINT: {{ .Values.server.config.otlpEndpoint | quote }}
  KSEAL_OTLP_SAMPLE_RATIO: {{ .Values.server.config.otlpSampleRatio | quote }}
  KSEAL_CMK_KMS_URI: {{ .Values.server.config.cmkKmsUri | quote }}
  KSEAL_RAW_RETENTION_DAYS: {{ .Values.server.config.rawRetentionDays | quote }}
  # WS-Q production data plane (fail-safe, default-off). Selectors are always
  # emitted (default "memory"); connection details are emitted only when set, so
  # default releases render a minimal, in-memory config. Passwords are SECRETS
  # delivered via the Secret/ExternalSecret, never this ConfigMap.
  {{- with .Values.server.config.dataPlane }}
  KSEAL_BROKER: {{ .broker | quote }}
  KSEAL_ANALYTICS: {{ .analytics | quote }}
  {{- if .kafka.brokers }}
  KSEAL_KAFKA_BROKERS: {{ join "," .kafka.brokers | quote }}
  {{- end }}
  {{- if .kafka.topic }}
  KSEAL_KAFKA_TOPIC: {{ .kafka.topic | quote }}
  {{- end }}
  {{- if .kafka.consumerGroup }}
  KSEAL_KAFKA_CONSUMER_GROUP: {{ .kafka.consumerGroup | quote }}
  {{- end }}
  KSEAL_KAFKA_TLS: {{ .kafka.tls | quote }}
  {{- if .kafka.caSecret.name }}
  KSEAL_KAFKA_CA_FILE: {{ printf "%s/%s" (trimSuffix "/" .kafka.caSecret.mountPath) .kafka.caSecret.key | quote }}
  {{- end }}
  {{- if .kafka.saslMechanism }}
  KSEAL_KAFKA_SASL_MECHANISM: {{ .kafka.saslMechanism | quote }}
  {{- end }}
  {{- if .kafka.saslUsername }}
  KSEAL_KAFKA_SASL_USERNAME: {{ .kafka.saslUsername | quote }}
  {{- end }}
  {{- if .clickhouse.addr }}
  KSEAL_CLICKHOUSE_ADDR: {{ join "," .clickhouse.addr | quote }}
  {{- end }}
  {{- if .clickhouse.database }}
  KSEAL_CLICKHOUSE_DATABASE: {{ .clickhouse.database | quote }}
  {{- end }}
  {{- if .clickhouse.username }}
  KSEAL_CLICKHOUSE_USERNAME: {{ .clickhouse.username | quote }}
  {{- end }}
  {{- if .clickhouse.table }}
  KSEAL_CLICKHOUSE_TABLE: {{ .clickhouse.table | quote }}
  {{- end }}
  {{- if .clickhouse.cluster }}
  KSEAL_CLICKHOUSE_CLUSTER: {{ .clickhouse.cluster | quote }}
  {{- end }}
  KSEAL_CLICKHOUSE_TLS: {{ .clickhouse.tls | quote }}
  {{- if .clickhouse.caSecret.name }}
  KSEAL_CLICKHOUSE_CA_FILE: {{ printf "%s/%s" (trimSuffix "/" .clickhouse.caSecret.mountPath) .clickhouse.caSecret.key | quote }}
  {{- end }}
  {{- if .clickhouse.retentionTtlDays | toString | ne "" }}
  KSEAL_CLICKHOUSE_RETENTION_TTL_DAYS: {{ .clickhouse.retentionTtlDays | quote }}
  {{- end }}
  {{- end }}
