apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kseal.fullname" . }}-server
  labels:
    {{- include "kseal.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
data:
  # Non-secret KSEAL_* tunables. Secrets (KEK/DSN/Redis) come from the Secret.
  KSEAL_HTTP_ADDR: ":{{ .Values.server.port }}"
  KSEAL_ENV: {{ .Values.env | quote }}
  KSEAL_LOG_LEVEL: {{ .Values.server.config.logLevel | quote }}
  KSEAL_REDIS_DB: {{ .Values.server.config.redisDB | quote }}
  KSEAL_NONCE_TTL: {{ .Values.server.config.nonceTTL | quote }}
  KSEAL_TRUST_TOKEN_TTL: {{ .Values.server.config.trustTokenTTL | quote }}
  KSEAL_CONFIG_TTL: {{ .Values.server.config.configTTL | quote }}
  KSEAL_RATE_LIMIT_RPS: {{ .Values.server.config.rateLimitRPS | quote }}
  KSEAL_RATE_LIMIT_BURST: {{ .Values.server.config.rateLimitBurst | quote }}
  KSEAL_INGEST_QUOTA_PER_MIN: {{ .Values.server.config.ingestQuotaPerMinute | quote }}
  KSEAL_CORS_ORIGINS: {{ join "," .Values.server.config.corsOrigins | quote }}
  {{- if .Values.server.config.featureFlags }}
  KSEAL_FEATURE_FLAGS: {{ .Values.server.config.featureFlags | quote }}
  {{- end }}
