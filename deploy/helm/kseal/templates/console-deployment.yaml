{{- if .Values.console.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kseal.fullname" . }}-console
  labels:
    {{- include "kseal.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  {{- if not .Values.console.autoscaling.enabled }}
  replicas: {{ .Values.console.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  selector:
    matchLabels:
      {{- include "kseal.console.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kseal.labels" . | nindent 8 }}
        app.kubernetes.io/component: console
    spec:
      serviceAccountName: {{ include "kseal.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.consolePodSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 15
      {{- with .Values.console.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- include "kseal.topologySpreadConstraints" (dict "constraints" . "selector" (include "kseal.console.selectorLabels" $)) | nindent 8 }}
      {{- end }}
      affinity:
        {{- $sel := include "kseal.console.selectorLabels" . -}}
        {{- include "kseal.podAntiAffinity" (list .Values.console.podAntiAffinityPreset $sel) | nindent 8 }}
        {{- include "kseal.regionNodeAffinity" . | nindent 8 }}
      {{- with .Values.console.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: console
          image: {{ include "kseal.console.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.consoleContainerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.console.port }}
              protocol: TCP
          env:
            # Rendered into /env.js at container start; tightens CSP connect-src.
            - name: KSEAL_API_BASE_URL
              value: {{ .Values.console.apiBaseUrl | quote }}
          livenessProbe:
            httpGet:
              path: {{ .Values.console.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.console.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.console.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.console.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.console.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.console.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.console.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.console.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.console.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.console.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
{{- end }}
