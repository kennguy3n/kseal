{{- if .Values.externalSecrets.enabled }}
# Pulls server secrets from the configured external store (AWS Secrets Manager,
# GCP Secret Manager, Vault, ...) into a Kubernetes Secret via the External
# Secrets Operator. No secret material is stored in git or the chart.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "kseal.fullname" . }}-secrets
  labels:
    {{- include "kseal.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "kseal.secretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          {{- include "kseal.labels" . | nindent 10 }}
  data:
    - secretKey: KSEAL_KEK
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeys.kek }}
    - secretKey: KSEAL_POSTGRES_DSN
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeys.postgresDsn }}
    - secretKey: KSEAL_REDIS_ADDR
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeys.redisAddr }}
    {{- if .Values.externalSecrets.remoteKeys.redisPassword }}
    - secretKey: KSEAL_REDIS_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeys.redisPassword }}
    {{- end }}
{{- end }}
