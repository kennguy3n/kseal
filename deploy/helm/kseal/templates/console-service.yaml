{{- if .Values.console.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kseal.fullname" . }}-console
  labels:
    {{- include "kseal.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
  {{- with .Values.console.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.console.service.type }}
  ports:
    - name: http
      port: {{ .Values.console.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "kseal.console.selectorLabels" . | nindent 4 }}
{{- end }}
