apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kseal.fullname" . }}-server
  labels:
    {{- include "kseal.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  {{- if not .Values.server.autoscaling.enabled }}
  replicas: {{ .Values.server.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  selector:
    matchLabels:
      {{- include "kseal.server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kseal.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
      annotations:
        # Roll pods when non-secret config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap-server.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.server.port | quote }}
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: {{ include "kseal.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Graceful shutdown: the server drains in-flight RPCs (10s) on SIGTERM.
      terminationGracePeriodSeconds: 30
      {{- with .Values.server.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- include "kseal.topologySpreadConstraints" (dict "constraints" . "selector" (include "kseal.server.selectorLabels" $)) | nindent 8 }}
      {{- end }}
      affinity:
        {{- $sel := include "kseal.server.selectorLabels" . -}}
        {{- include "kseal.podAntiAffinity" (list .Values.server.podAntiAffinityPreset $sel) | nindent 8 }}
        {{- include "kseal.regionNodeAffinity" . | nindent 8 }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "kseal.server.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "kseal.fullname" . }}-server
            - secretRef:
                name: {{ include "kseal.secretName" . }}
          {{- with .Values.server.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.server.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.server.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.server.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.server.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.server.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.server.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.server.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.server.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.server.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.server.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.server.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.server.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.server.probes.readiness.failureThreshold }}
            successThreshold: {{ .Values.server.probes.readiness.successThreshold }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.server.config.redisCaSecret.name }}
            - name: redis-ca
              mountPath: {{ .Values.server.config.redisCaSecret.mountPath | quote }}
              readOnly: true
            {{- end }}
      volumes:
        # readOnlyRootFilesystem is on; give the process a writable scratch dir.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if .Values.server.config.redisCaSecret.name }}
        # Custom CA bundle for Redis TLS (KSEAL_REDIS_CA_FILE points here).
        - name: redis-ca
          secret:
            secretName: {{ .Values.server.config.redisCaSecret.name | quote }}
            items:
              - key: {{ .Values.server.config.redisCaSecret.key | quote }}
                path: {{ .Values.server.config.redisCaSecret.key | quote }}
        {{- end }}
