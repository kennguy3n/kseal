# Splunk props.conf for the kseal trust/risk export sourcetype.
#
# kseal delivers HEC event envelopes whose "event" object contains ONLY the
# minimized, non-PII contract fields (see docs/siem-integration.md). This stanza
# turns those JSON events into well-typed, indexed fields.
#
# Install on the Splunk indexers/heavy forwarders alongside transforms.conf.

[kseal:trust]
# kseal sets HEC "time" from the coarse time bucket (epoch seconds).
TIME_PREFIX = \"coarse_time_bucket\":
TIME_FORMAT = %s
MAX_TIMESTAMP_LOOKAHEAD = 20
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 10000
KV_MODE = json
# Promote the stable identity/risk fields for fast search-time access.
FIELDALIAS-kseal_tenant = tenant_id AS kseal_tenant_id
FIELDALIAS-kseal_app = app_id AS kseal_app_id
EVAL-kseal_risk_bits = tonumber(risk_bits)
# risk_signals is a JSON array of stable per-signal names (e.g. "debugger",
# "app_tamper"); KV_MODE = json extracts it as a multivalue field, so prefer
# correlating on risk_signals rather than numeric risk_bits positions.
REPORT-kseal_fields = kseal_trust_fields
