# Splunk transforms.conf companion to props.conf for the kseal:trust sourcetype.
#
# The export is already JSON (KV_MODE = json handles extraction), so this stanza
# primarily documents the canonical field set and provides an explicit
# extraction for environments where automatic JSON KV is disabled.

[kseal_trust_fields]
SOURCE_KEY = _raw
# Canonical, non-PII contract fields only. Any field outside this set is a bug
# in the exporter and is rejected by the privacy_contract test.
REGEX = \"(tenant_id|app_id|event_type|risk_level|risk_bits|confidence|build_hash|policy_hash|install_key_hash|coarse_time_bucket|country_or_region)\"\s*:\s*\"?([^\",}]+)
FORMAT = $1::$2
MV_ADD = true
