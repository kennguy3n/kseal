[package]
name = "kseal-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "C ABI FFI exports for the kseal trust core (Android NDK + iOS)."

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Propagates compile-time string obfuscation to the trust core when the shipped
# native artifact (.so / staticlib) is built hardened. Off by default.
obfuscate-strings = ["kseal-core/obfuscate-strings"]

[dependencies]
kseal-core = { path = "../kseal-core" }
prost.workspace = true
libc.workspace = true

[dev-dependencies]
ed25519-dalek.workspace = true

[build-dependencies]
cbindgen = "0.27"
