syntax = "proto3";

package kseal.v1;

import "kseal/v1/common.proto";

option go_package = "github.com/kennguy3n/kseal/server/gen/kseal/v1;ksealv1";

// Webhook is a tenant-registered HTTP endpoint that receives signed events.
message Webhook {
  string id = 1;
  string tenant_id = 2;
  string url = 3;
  repeated EventType event_types = 4;
  string signing_key_id = 5;
  bool is_active = 6;
  int64 created_at = 7;
}

// WebhookEvent is the payload delivered to a registered webhook. The HMAC
// signature is sent in a header; this message is the JSON/proto body.
message WebhookEvent {
  EventType event_type = 1;
  string tenant_id = 2;
  string app_id = 3;
  // Event-specific payload as JSON.
  string payload = 4;
  int64 timestamp = 5;
  // HMAC-SHA256 signature over the serialized payload.
  bytes signature = 6;
}

message RegisterWebhookRequest {
  string tenant_id = 1;
  string url = 2;
  repeated EventType event_types = 3;
}
message RegisterWebhookResponse { Webhook webhook = 1; }

message ListWebhooksRequest { string tenant_id = 1; }
message ListWebhooksResponse { repeated Webhook webhooks = 1; }

message DeleteWebhookRequest {
  string tenant_id = 1;
  string id = 2;
}
message DeleteWebhookResponse { bool deleted = 1; }
