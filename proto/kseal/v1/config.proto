syntax = "proto3";

package kseal.v1;

import "kseal/v1/common.proto";
import "kseal/v1/compliance.proto";

option go_package = "github.com/kennguy3n/kseal/server/gen/kseal/v1;ksealv1";

// SignedConfig wraps a serialized PolicyConfig with an Ed25519 signature so the
// SDK can verify authenticity offline and cache it behind a CDN.
//
// The signature authenticates the whole envelope, not just config_bytes. It is
// computed over a canonical, domain-separated, length-prefixed preimage:
//   u32_be(len)||"kseal/v1/signed-config" || i64_be(version) ||
//   i64_be(ttl_seconds) || u32_be(len)||key_id || u32_be(len)||config_bytes
// so version (rollback anchor), ttl_seconds (staleness anchor), key_id and
// config_bytes are all covered, closing the CDN/cache tamper vector. The Go
// server and the Rust device core mirror this layout byte-for-byte (pinned by a
// shared golden vector).
message SignedConfig {
  // Serialized PolicyConfig bytes (part of the signed envelope preimage).
  bytes config_bytes = 1;
  // Ed25519 signature over the canonical envelope preimage (see message docs):
  // version, ttl_seconds, key_id and config_bytes are all authenticated.
  bytes signature = 2;
  // Identifier of the signing key (for rotation).
  string key_id = 3;
  // Monotonically increasing config version for the (tenant, app).
  int64 version = 4;
  // Client-side cache lifetime in seconds.
  int64 ttl_seconds = 5;
}

// PolicyRule is a single risk-driven rule. A rule fires when the masked risk
// bits are non-zero (or meet the threshold) and selects an enforcement action.
message PolicyRule {
  string id = 1;
  // Risk bits this rule is sensitive to.
  uint64 risk_mask = 2;
  // Minimum weighted score required for the rule to fire (0 = any bit).
  uint32 min_score = 3;
  EnforcementMode action = 4;
  string description = 5;
}

// PolicyConfig is the device-side policy: which modules run, the per-signal
// weights, the risk thresholds, and the ordered enforcement rules.
message PolicyConfig {
  repeated PolicyRule rules = 1;
  // Threshold scores keyed by TrustLevel name (e.g. "MEDIUM_RISK" -> 40).
  map<string, uint32> risk_thresholds = 2;
  EnforcementMode default_mode = 3;
  // Module identifiers enabled for this app (e.g. "root", "debugger").
  repeated string modules_enabled = 4;
  // Per-bit weights for composite risk scoring (bit index -> weight).
  map<uint32, uint32> signal_weights = 5;
  string policy_hash = 6;
}

// ConfigRequest is sent by the SDK to fetch the current signed config.
message ConfigRequest {
  string tenant_id = 1;
  string app_id = 2;
  Platform platform = 3;
  string sdk_version = 4;
  // Opaque, tenant-scoped rotating instance identifier used for deterministic
  // canary bucketing. Empty disables candidate selection for the caller
  // (fail-safe: it stays on the stable config). Never a device fingerprint.
  string instance_id = 5;
}

// ConfigResponse returns the signed config plus cache validators.
message ConfigResponse {
  SignedConfig config = 1;
  string etag = 2;
  int64 last_modified = 3;
  // Signed remote kill switch in effect for the scope, when one is active and
  // the kill-switch feature is enabled for the tenant. Absent by default. The
  // SDK verifies the Ed25519 signature before acting; an absent or invalid
  // command never disables (fail-safe).
  SignedKillSwitch kill_switch = 4;
}

// PolicyRequest fetches the raw (unsigned) active policy, for tooling.
message PolicyRequest {
  string tenant_id = 1;
  string app_id = 2;
}

// PolicyResponse returns the active policy and its hash.
message PolicyResponse {
  PolicyConfig policy = 1;
}
