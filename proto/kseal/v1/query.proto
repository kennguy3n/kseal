syntax = "proto3";

package kseal.v1;

import "kseal/v1/common.proto";

option go_package = "github.com/kennguy3n/kseal/server/gen/kseal/v1;ksealv1";

// EventRecord is a stored, queryable risk event: a server-enriched, persisted
// projection of a TelemetryEvent (plus the fused trust level and a stable id).
message EventRecord {
  string id = 1;
  string tenant_id = 2;
  string app_id = 3;
  EventType event_type = 4;
  // Fused trust classification for the originating instance at event time.
  TrustLevel risk_level = 5;
  uint64 risk_bits = 6;
  Confidence confidence = 7;
  string app_build_hash = 8;
  string policy_hash = 9;
  // Event time in unix milliseconds.
  int64 timestamp = 10;
  optional string country_or_region = 11;
}

message ListEventsRequest {
  string tenant_id = 1;
  // Optional app filter; empty means all apps in the tenant.
  string app_id = 2;
  // Optional event-type filter; empty means all types.
  repeated EventType event_types = 3;
  // Optional risk-level filter; empty means all levels.
  repeated TrustLevel risk_levels = 4;
  // Inclusive lower/upper time bounds in unix millis (0 means unbounded).
  int64 start_time = 5;
  int64 end_time = 6;
  int32 page_size = 7;
  string page_token = 8;
}

message ListEventsResponse {
  repeated EventRecord events = 1;
  string next_page_token = 2;
}

message GetTenantOverviewRequest {
  string tenant_id = 1;
}

message GetTenantOverviewResponse {
  int32 app_count = 1;
  int32 build_count = 2;
  int32 active_policy_count = 3;
  int32 webhook_count = 4;
  int64 events_last_24h = 5;
  // A small slice of the most recent events for the overview panel.
  repeated EventRecord recent_events = 6;
  // Cohorts in this tenant whose population is currently in a fleet-anomaly
  // surge — a coordinated abuse-signal spike above the cohort's learned baseline
  // and/or a volume-velocity spike. Empty when the fleet guard is disabled or no
  // cohort is anomalous.
  repeated FleetAnomaly active_fleet_anomalies = 7;
}

// FleetAnomaly summarises a currently-anomalous (tenant, app, build, region)
// cohort for the dashboard. It is derived from aggregate, non-PII risk-signal
// counts and arrival volume; it carries no per-user data.
message FleetAnomaly {
  string app_id = 1;
  // Names of the surging signals (e.g. "emulator", "attestation_fail"). May be
  // empty when only a volume-velocity spike tripped the anomaly.
  repeated string signals = 2;
  // Largest current/baseline surge ratio among the surging signals (0 when the
  // baseline is not yet seeded — i.e. a cold-start absolute-rate trip).
  double max_surge_ratio = 3;
  // Highest current rate (0..1) among the surging signals.
  double max_current_rate = 4;
  // Number of attestations observed in the current window for this cohort.
  int64 observed = 5;
  // Build hash of the cohort ("" when not cohorted by build).
  string build_hash = 6;
  // Best-effort region/country of the cohort ("" when unknown).
  string region = 7;
  // True when the cohort's arrival volume spiked far above its baseline.
  bool velocity_surge = 8;
  // windowVolume/projected-baseline-volume (0 on a cold-start volume trip).
  double velocity_ratio = 9;
}

message GetTrustSessionStatsRequest {
  string tenant_id = 1;
  // Window bounds in unix millis (0 means unbounded).
  int64 start_time = 2;
  int64 end_time = 3;
}

message GetTrustSessionStatsResponse {
  int64 total_sessions = 1;
  int64 tokens_issued = 2;
  int64 attestations_failed = 3;
  // Session counts bucketed by fused TrustLevel name (e.g. "TRUSTED" -> 1200).
  map<string, int64> sessions_by_trust_level = 4;
}
