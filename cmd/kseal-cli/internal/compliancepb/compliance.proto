syntax = "proto3";

// STREAM-LOCAL proto. This is intentionally NOT under the canonical proto/ tree.
// It declares the read-only compliance/audit RPCs that WS-K is adding to the
// canonical kseal API so this CLI stream can build a generated client and ship
// the commands ahead of the server. The CLI degrades gracefully: if the server
// does not implement an RPC (Connect code Unimplemented), the command reports
// "server capability unavailable" instead of failing. Once WS-K merges, the
// parent session repoints these commands at the canonical client and deletes
// this file.
package kseal.compliancelocal.v1;

option go_package = "github.com/kennguy3n/kseal/cli/internal/compliancepb;compliancepb";

// ComplianceService exposes read-only compliance evidence. All RPCs are
// tenant-scoped; the server enforces isolation and the CLI requires a tenant.
service ComplianceService {
  // GetAuditTrail returns the tenant's operator audit entries (control-plane
  // actions). Entries carry no end-user PII.
  rpc GetAuditTrail(GetAuditTrailRequest) returns (GetAuditTrailResponse);
  // GetKillSwitchState returns the current kill-switch / canary state for a
  // tenant (optionally narrowed to one app).
  rpc GetKillSwitchState(GetKillSwitchStateRequest) returns (GetKillSwitchStateResponse);
  // GetDataProcessingRegistry returns the tenant's record-of-processing
  // entries (purpose, categories, legal basis, retention, processors).
  rpc GetDataProcessingRegistry(GetDataProcessingRegistryRequest) returns (GetDataProcessingRegistryResponse);
}

message GetAuditTrailRequest {
  string tenant_id = 1;
  string app_id = 2; // optional filter
  int32 page_size = 3;
  string page_token = 4;
}

// AuditEntry is one control-plane action. Time is a coarse bucket (no precise
// timestamps) and the actor is an operator/service principal, never an end user.
message AuditEntry {
  string id = 1;
  int64 time_bucket = 2;
  string actor = 3;
  string action = 4;
  string target = 5;
  string detail = 6;
}

message GetAuditTrailResponse {
  repeated AuditEntry entries = 1;
  string next_page_token = 2;
}

message GetKillSwitchStateRequest {
  string tenant_id = 1;
  string app_id = 2; // optional; empty = tenant-wide state
}

message GetKillSwitchStateResponse {
  string tenant_id = 1;
  string app_id = 2;
  bool engaged = 3;
  string scope = 4; // tenant|app|build
  string reason = 5;
  string policy_hash = 6;
  int64 updated_bucket = 7;
}

message GetDataProcessingRegistryRequest {
  string tenant_id = 1;
}

// ProcessingRecord is one record-of-processing-activities entry.
message ProcessingRecord {
  string purpose = 1;
  repeated string data_categories = 2;
  string legal_basis = 3;
  string retention = 4;
  repeated string processors = 5;
  bool encrypted_in_transit = 6;
  bool encrypted_at_rest = 7;
}

message GetDataProcessingRegistryResponse {
  string tenant_id = 1;
  repeated ProcessingRecord records = 2;
}
